name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Each release gets its own branch, named after the commit it was built from, so past
      # releases stay addressable instead of being force-pushed away by the next one.
      - run: |
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=release-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The declaration emit is the whole point of building here: when pnpm runs the
      # `prepare` build from inside its store, TypeScript sees the sources under a
      # node_modules path and silently skips .d.ts output.
      - run: |
          for f in dist/index.d.ts dist/shadcn/button/button.d.ts; do
            if [ ! -f "$f" ]; then
              echo "::error::declaration emit failed: $f is missing"
              exit 1
            fi
          done
          count=$(find dist -type f -name '*.d.ts' | wc -l | tr -d '[:space:]')
          echo "emitted $count .d.ts files under dist/"
          if [ "$count" -lt 50 ]; then
            echo "::error::only $count .d.ts files emitted (a full build produces ~66), declaration emit is partial"
            exit 1
          fi

      # Assemble the release tree: dist, the raw CSS behind the ./global.css export, and a
      # package.json with no scripts (so consumers never rebuild) and no devDependencies.
      - run: |
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/src"
          cp -R dist "$RELEASE_DIR/dist"
          cp src/global.css "$RELEASE_DIR/src/global.css"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.scripts;
            delete pkg.devDependencies;
            fs.writeFileSync(`${process.env.RELEASE_DIR}/package.json`, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      # Committing in a fresh repo keeps the branch a single parentless commit, so it never
      # accumulates history or conflicts in generated files. --force only ever rewrites this
      # commit's own branch, since the name is derived from $GITHUB_SHA.
      - run: |
          cd "$RELEASE_DIR"
          git init -q -b "$RELEASE_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "chore(release): build from $GITHUB_SHA"
          git push --force "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$RELEASE_BRANCH:$RELEASE_BRANCH"
          echo "Released to \`$RELEASE_BRANCH\` from \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
